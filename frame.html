<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>枠トリミングツール - Frame Cropper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .nav-link {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .preview-section {
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        #uploadSection {
            margin-top: 30px;
        }

        .editor-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .editor-section h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
            text-align: center;
        }

        #cropCanvas {
            display: block;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .crop-frame {
            position: absolute;
            border: 3px solid #f5576c;
            background: rgba(245, 87, 108, 0.1);
            box-shadow: 0 0 0 2px rgba(240, 147, 251, 0.5);
            cursor: move;
            z-index: 10;
        }

        .resize-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #f5576c;
            border: 2px solid white;
            border-radius: 50%;
            z-index: 11;
        }

        .resize-handle.nw {
            top: -8px;
            left: -8px;
            cursor: nw-resize;
        }

        .resize-handle.ne {
            top: -8px;
            right: -8px;
            cursor: ne-resize;
        }

        .resize-handle.sw {
            bottom: -8px;
            left: -8px;
            cursor: sw-resize;
        }

        .resize-handle.se {
            bottom: -8px;
            right: -8px;
            cursor: se-resize;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .result-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3rem;
        }

        .result-image {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .image-info {
            margin-bottom: 15px;
            color: #666;
            font-size: 0.95rem;
        }

        .download-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 0 auto;
            padding: 12px 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #f5576c;
            border-radius: 15px;
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff5f6;
        }

        .upload-area:hover {
            border-color: #f093fb;
            background: #ffedf0;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #f093fb;
            background: #ffe0e6;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #f5576c;
        }

        .upload-area p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-area small {
            color: #999;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .reset-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 15px auto 0;
            padding: 12px 20px;
            background: #fff;
            color: #f5576c;
            border: 2px solid #f5576c;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #f5576c;
            color: white;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .upload-section {
                padding: 30px 20px;
            }

            .results-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔲 枠トリミングツール</h1>
            <p>トリミング枠で自由に切り出し、アスペクト比別のトリミングも表示</p>
            <a href="index.html" class="nav-link">🏠 ホームに戻る</a>
        </header>

        <section class="preview-section" id="previewSection">
            <div class="results-container">
                <div class="result-section" id="editorResultSection">
                    <h2>🖱️ トリミング枠をドラッグ・リサイズで調整</h2>
                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="cropCanvas"></canvas>
                        <div class="crop-frame" id="cropFrame">
                            <div class="resize-handle nw" data-handle="nw"></div>
                            <div class="resize-handle ne" data-handle="ne"></div>
                            <div class="resize-handle sw" data-handle="sw"></div>
                            <div class="resize-handle se" data-handle="se"></div>
                        </div>
                    </div>
                </div>

                <div class="result-section" id="mainResultSection">
                    <h2>📐 トリミング結果</h2>
                    <img id="mainResultImage" class="result-image" alt="トリミング結果">
                    <div class="image-info" id="mainImageInfo"></div>
                    <a id="mainDownloadBtn" class="download-btn" download="cropped.jpg">⬇️ ダウンロード</a>
                </div>

                <div class="result-section" id="aspectResultSection" style="display: none;">
                    <h2 id="aspectResultTitle">アスペクト比トリミング</h2>
                    <img id="aspectResultImage" class="result-image" alt="アスペクト比トリミング">
                    <div class="image-info" id="aspectImageInfo"></div>
                </div>
            </div>

            <div style="text-align: center;">
                <button class="reset-btn" id="resetBtn">🔄 リセット</button>
            </div>
        </section>

        <section class="upload-section" id="uploadSection">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p>画像をここにドラッグ&ドロップ</p>
                <p>またはクリックしてファイルを選択</p>
                <small>対応形式: PNG, JPG, JPEG, WEBP</small>
            </div>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp">
        </section>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const canvasContainer = document.getElementById('canvasContainer');
        const cropCanvas = document.getElementById('cropCanvas');
        const cropFrame = document.getElementById('cropFrame');
        const mainResultImage = document.getElementById('mainResultImage');
        const mainImageInfo = document.getElementById('mainImageInfo');
        const mainDownloadBtn = document.getElementById('mainDownloadBtn');
        const aspectResultSection = document.getElementById('aspectResultSection');
        const aspectResultTitle = document.getElementById('aspectResultTitle');
        const aspectResultImage = document.getElementById('aspectResultImage');
        const aspectImageInfo = document.getElementById('aspectImageInfo');
        const resetBtn = document.getElementById('resetBtn');

        // グローバル変数
        let originalImage = null;
        let originalFileName = '';
        let canvasScale = 1;
        let cropFrameSize = { width: 200, height: 200 };
        let cropPosition = { x: 0, y: 0 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let isResizing = false;
        let resizeHandle = null;
        let resizeStart = { x: 0, y: 0 };
        let resizeStartSize = { width: 0, height: 0 };
        let resizeStartPos = { x: 0, y: 0 };
        let croppedImage = null; // トリミング結果を保存

        // クリックでファイル選択
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // ファイル選択時の処理
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleImage(e.target.files[0]);
            }
        });

        // ドラッグ&ドロップの処理
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleImage(e.dataTransfer.files[0]);
            }
        });

        // 画像処理メインロジック
        function handleImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('画像ファイルを選択してください');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    originalFileName = file.name;
                    initializeCanvas();
                    previewSection.classList.add('active');
                    controlsSection.style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Canvasの初期化
        function initializeCanvas() {
            const maxWidth = 1000;
            canvasScale = Math.min(1, maxWidth / Math.max(originalImage.width, originalImage.height));
            const displayWidth = originalImage.width * canvasScale;
            const displayHeight = originalImage.height * canvasScale;

            cropCanvas.width = displayWidth;
            cropCanvas.height = displayHeight;

            const ctx = cropCanvas.getContext('2d');
            ctx.drawImage(originalImage, 0, 0, displayWidth, displayHeight);

            // 初期のトリミング枠サイズ（表示サイズの最大）
            cropFrameSize.width = displayWidth;
            cropFrameSize.height = displayHeight;

            // 初期位置を中央に
            cropPosition.x = (displayWidth - cropFrameSize.width) / 2;
            cropPosition.y = (displayHeight - cropFrameSize.height) / 2;

            updateCropFrame();
            updateCroppedImages();
        }

        // トリミング枠の表示を更新
        function updateCropFrame() {
            cropFrame.style.width = cropFrameSize.width + 'px';
            cropFrame.style.height = cropFrameSize.height + 'px';
            cropFrame.style.top = cropPosition.y + 'px';
            cropFrame.style.left = cropPosition.x + 'px';
        }

        // 切り出しフレームのドラッグ
        cropFrame.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('resize-handle')) return;
            e.preventDefault();
            isDragging = true;
            dragStart.x = e.clientX - cropPosition.x;
            dragStart.y = e.clientY - cropPosition.y;
        });

        // リサイズハンドルのドラッグ
        document.querySelectorAll('.resize-handle').forEach(handle => {
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                isResizing = true;
                resizeHandle = handle.dataset.handle;
                resizeStart.x = e.clientX;
                resizeStart.y = e.clientY;
                resizeStartSize.width = cropFrameSize.width;
                resizeStartSize.height = cropFrameSize.height;
                resizeStartPos.x = cropPosition.x;
                resizeStartPos.y = cropPosition.y;
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (isResizing) {
                // リサイズ処理
                const dx = e.clientX - resizeStart.x;
                const dy = e.clientY - resizeStart.y;
                const minSize = 50; // 最小サイズ

                let newSize = { width: resizeStartSize.width, height: resizeStartSize.height };
                let newPos = { x: resizeStartPos.x, y: resizeStartPos.y };

                // 幅の変更
                if (resizeHandle.includes('e')) {
                    // 右端をドラッグ
                    newSize.width = Math.max(minSize, Math.min(resizeStartSize.width + dx, cropCanvas.width - newPos.x));
                }
                if (resizeHandle.includes('w')) {
                    // 左端をドラッグ
                    const newWidth = Math.max(minSize, Math.min(resizeStartSize.width - dx, resizeStartPos.x + resizeStartSize.width));
                    newSize.width = newWidth;
                    newPos.x = resizeStartPos.x + resizeStartSize.width - newWidth;
                }

                // 高さの変更
                if (resizeHandle.includes('s')) {
                    // 下端をドラッグ
                    newSize.height = Math.max(minSize, Math.min(resizeStartSize.height + dy, cropCanvas.height - newPos.y));
                }
                if (resizeHandle.includes('n')) {
                    // 上端をドラッグ
                    const newHeight = Math.max(minSize, Math.min(resizeStartSize.height - dy, resizeStartPos.y + resizeStartSize.height));
                    newSize.height = newHeight;
                    newPos.y = resizeStartPos.y + resizeStartSize.height - newHeight;
                }

                cropFrameSize.width = newSize.width;
                cropFrameSize.height = newSize.height;
                cropPosition.x = newPos.x;
                cropPosition.y = newPos.y;

                updateCropFrame();
                updateCroppedImages();
                return;
            }

            if (!isDragging) return;

            let newX = e.clientX - dragStart.x;
            let newY = e.clientY - dragStart.y;

            const maxX = cropCanvas.width - cropFrameSize.width;
            const maxY = cropCanvas.height - cropFrameSize.height;

            if (newX < 0) newX = 0;
            if (newX > maxX) newX = maxX;
            if (newY < 0) newY = 0;
            if (newY > maxY) newY = maxY;

            cropPosition.x = newX;
            cropPosition.y = newY;

            updateCropFrame();
            updateCroppedImages();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
            resizeHandle = null;
        });

        // 切り出し画像を更新
        function updateCroppedImages() {
            const sourceX = cropPosition.x / canvasScale;
            const sourceY = cropPosition.y / canvasScale;
            const sourceWidth = cropFrameSize.width / canvasScale;
            const sourceHeight = cropFrameSize.height / canvasScale;

            // アスペクト比の計算（小さいほうを1とする）
            const aspectRatio = sourceWidth / sourceHeight;
            let aspectText;
            if (aspectRatio >= 1) {
                // 横長または正方形
                aspectText = `${aspectRatio.toFixed(2)}:1`;
            } else {
                // 縦長
                aspectText = `1:${(1 / aspectRatio).toFixed(2)}`;
            }

            // メインのトリミング結果（原寸）をcanvasとして保存
            croppedImage = document.createElement('canvas');
            const mainCtx = croppedImage.getContext('2d');
            croppedImage.width = sourceWidth;
            croppedImage.height = sourceHeight;

            mainCtx.drawImage(
                originalImage,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, sourceWidth, sourceHeight
            );

            const mainDataUrl = croppedImage.toDataURL('image/jpeg', 0.95);
            mainResultImage.src = mainDataUrl;
            mainImageInfo.textContent = `サイズ: ${Math.round(sourceWidth)} × ${Math.round(sourceHeight)} px | アスペクト比: ${aspectText}`;
            mainDownloadBtn.href = mainDataUrl;
            mainDownloadBtn.download = `${getFileNameWithoutExt(originalFileName)}_cropped.jpg`;

            // アスペクト比に応じた追加トリミング
            if (aspectRatio > 16 / 9) {
                // 16:9より横長 → 16:9でトリミング
                aspectResultSection.style.display = 'block';
                aspectResultTitle.textContent = '📺 16:9 トリミング';

                // 高さを基準にして幅を調整
                const targetHeight = sourceHeight;
                const targetWidth = targetHeight * (16 / 9);
                const cropX = (sourceWidth - targetWidth) / 2;

                const aspectCanvas = document.createElement('canvas');
                const aspectCtx = aspectCanvas.getContext('2d');
                aspectCanvas.width = targetWidth;
                aspectCanvas.height = targetHeight;

                aspectCtx.drawImage(
                    croppedImage,
                    cropX, 0, targetWidth, targetHeight,
                    0, 0, targetWidth, targetHeight
                );

                const aspectDataUrl = aspectCanvas.toDataURL('image/jpeg', 0.95);
                aspectResultImage.src = aspectDataUrl;
                aspectImageInfo.textContent = `サイズ: ${Math.round(targetWidth)} × ${Math.round(targetHeight)} px | 16:9`;
            } else if (aspectRatio < 3 / 4) {
                // 3:4より縦長 → 3:4でトリミング
                aspectResultSection.style.display = 'block';
                aspectResultTitle.textContent = '📱 3:4 トリミング';

                // 幅を基準にして高さを調整
                const targetWidth = sourceWidth;
                const targetHeight = targetWidth * (4 / 3);
                const cropY = (sourceHeight - targetHeight) / 2;

                const aspectCanvas = document.createElement('canvas');
                const aspectCtx = aspectCanvas.getContext('2d');
                aspectCanvas.width = targetWidth;
                aspectCanvas.height = targetHeight;

                aspectCtx.drawImage(
                    croppedImage,
                    0, cropY, targetWidth, targetHeight,
                    0, 0, targetWidth, targetHeight
                );

                const aspectDataUrl = aspectCanvas.toDataURL('image/jpeg', 0.95);
                aspectResultImage.src = aspectDataUrl;
                aspectImageInfo.textContent = `サイズ: ${Math.round(targetWidth)} × ${Math.round(targetHeight)} px | 3:4`;
            } else {
                // 追加トリミングなし
                aspectResultSection.style.display = 'none';
            }
        }

        // リセットボタン
        resetBtn.addEventListener('click', () => {
            if (originalImage) {
                initializeCanvas();
            }
        });

        // ファイル名から拡張子を除いた部分を取得
        function getFileNameWithoutExt(filename) {
            const lastDotIndex = filename.lastIndexOf('.');
            return lastDotIndex !== -1 ? filename.substring(0, lastDotIndex) : filename;
        }
    </script>
</body>
</html>
