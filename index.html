<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像分割ツール - Image Splitter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-area p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-area small {
            color: #999;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .original-image {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .original-image h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .original-image img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .split-images {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .split-images h2 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .split-image-card {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .split-image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .split-image-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .image-info {
            text-align: center;
            margin-bottom: 15px;
        }

        .image-info h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 5px;
        }

        .image-info p {
            font-size: 0.9rem;
            color: #666;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .reset-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto 0;
            padding: 15px 30px;
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .upload-section {
                padding: 30px 20px;
            }

            .images-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📷 画像分割ツール</h1>
            <p>画像を縦方向に4等分して、1クリックでダウンロード</p>
        </header>

        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p>画像をここにドラッグ&ドロップ</p>
                <p>またはクリックしてファイルを選択</p>
                <small>対応形式: PNG, JPG, JPEG, WEBP</small>
            </div>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp">
        </section>

        <section class="preview-section" id="previewSection">
            <div class="original-image">
                <h2>📸 元の画像</h2>
                <img id="originalImage" alt="元の画像">
            </div>

            <div class="split-images">
                <h2>✂️ 分割された画像 (4等分)</h2>
                <div class="images-grid" id="imagesGrid">
                    <!-- 分割された画像がここに動的に追加される -->
                </div>
            </div>

            <button class="reset-btn" id="resetBtn">🔄 新しい画像をアップロード</button>
        </section>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const originalImage = document.getElementById('originalImage');
        const imagesGrid = document.getElementById('imagesGrid');
        const resetBtn = document.getElementById('resetBtn');

        // クリックでファイル選択
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // ファイル選択時の処理
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleImage(e.target.files[0]);
            }
        });

        // ドラッグ&ドロップの処理
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleImage(e.dataTransfer.files[0]);
            }
        });

        // 画像処理メインロジック
        function handleImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('画像ファイルを選択してください');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    splitImage(img, file.name, file.type);
                };
                img.src = e.target.result;
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 画像を4等分する関数
        function splitImage(img, originalName, mimeType) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const width = img.width;
            const height = img.height;
            const segmentHeight = height / 4;
            const margin = 6; // 上下6pxを削除

            imagesGrid.innerHTML = '';

            for (let i = 0; i < 4; i++) {
                // マージンを考慮した分割位置
                const startY = i * segmentHeight + margin;
                const endY = (i + 1) * segmentHeight - margin;
                const splitHeight = endY - startY;

                canvas.width = width;
                canvas.height = splitHeight;

                // 画像を描画（マージン調整済み）
                ctx.drawImage(img, 0, startY, width, splitHeight, 0, 0, width, splitHeight);

                // CanvasをデータURLに変換
                const dataUrl = canvas.toDataURL(mimeType, 1.0);

                // 分割した画像の表示とダウンロード機能を作成
                createSplitImageCard(dataUrl, i + 1, width, splitHeight, originalName, mimeType);
            }

            previewSection.classList.add('active');
        }

        // 分割画像カードを作成
        function createSplitImageCard(dataUrl, index, width, height, originalName, mimeType) {
            const card = document.createElement('div');
            card.className = 'split-image-card';

            const img = document.createElement('img');
            img.src = dataUrl;
            img.alt = `分割画像 ${index}`;

            const info = document.createElement('div');
            info.className = 'image-info';
            info.innerHTML = `
                <h3>分割画像 ${index}</h3>
                <p>${width} × ${height} px</p>
            `;

            const downloadBtn = document.createElement('a');
            downloadBtn.className = 'download-btn';
            downloadBtn.href = dataUrl;
            downloadBtn.download = `${getFileNameWithoutExt(originalName)}_${index}.${getFileExt(originalName)}`;
            downloadBtn.textContent = '⬇️ ダウンロード';

            card.appendChild(img);
            card.appendChild(info);
            card.appendChild(downloadBtn);

            imagesGrid.appendChild(card);
        }

        // ファイル名から拡張子を除いた部分を取得
        function getFileNameWithoutExt(filename) {
            const lastDotIndex = filename.lastIndexOf('.');
            return lastDotIndex !== -1 ? filename.substring(0, lastDotIndex) : filename;
        }

        // ファイル拡張子を取得
        function getFileExt(filename) {
            const lastDotIndex = filename.lastIndexOf('.');
            return lastDotIndex !== -1 ? filename.substring(lastDotIndex + 1).toLowerCase() : 'png';
        }

        // リセットボタン
        resetBtn.addEventListener('click', () => {
            previewSection.classList.remove('active');
            fileInput.value = '';
            originalImage.src = '';
            imagesGrid.innerHTML = '';
        });
    </script>
</body>
</html>
