<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像分割ツール - Image Splitter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-area p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-area small {
            color: #999;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        #uploadSection {
            margin-top: 30px;
        }

        .original-image {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .original-image h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .original-image img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .editor-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .editor-section h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }

        #splitCanvas {
            display: block;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .divider {
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(102, 126, 234, 0.8);
            cursor: ns-resize;
            border: 2px solid rgba(118, 75, 162, 0.8);
            box-sizing: border-box;
            transition: background 0.2s ease;
            z-index: 10;
        }

        .divider:hover {
            background: rgba(102, 126, 234, 1);
        }

        .divider::before {
            content: '⋮';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }

        .split-images {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .split-images h2 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .split-image-card {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .split-image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .split-image-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .image-info {
            text-align: center;
            margin-bottom: 15px;
        }

        .image-info h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 5px;
        }

        .image-info p {
            font-size: 0.9rem;
            color: #666;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .reset-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto 0;
            padding: 15px 30px;
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .upload-section {
                padding: 30px 20px;
            }

            .images-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📷 画像分割ツール</h1>
            <p>画像を縦方向に4等分して、1クリックでダウンロード</p>
        </header>

        <section class="preview-section" id="previewSection">
            <div class="editor-section">
                <h2>✂️ 分割位置を調整</h2>
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="splitCanvas"></canvas>
                </div>
            </div>

            <div class="split-images">
                <h2>📊 分割された画像</h2>
                <div class="images-grid" id="imagesGrid">
                    <!-- 分割された画像がここに動的に追加される -->
                </div>
            </div>
        </section>

        <section class="upload-section" id="uploadSection">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p>画像をここにドラッグ&ドロップ</p>
                <p>またはクリックしてファイルを選択</p>
                <small>対応形式: PNG, JPG, JPEG, WEBP</small>
            </div>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp">
        </section>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const canvasContainer = document.getElementById('canvasContainer');
        const splitCanvas = document.getElementById('splitCanvas');
        const imagesGrid = document.getElementById('imagesGrid');

        // グローバル変数
        let originalImage = null;
        let originalFileName = '';
        let splitPositions = []; // 分割位置（ピクセル単位）
        let dividers = []; // 境界線要素
        let isDragging = false;
        let currentDividerIndex = -1;

        // クリックでファイル選択
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // ファイル選択時の処理
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleImage(e.target.files[0]);
            }
        });

        // ドラッグ&ドロップの処理
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleImage(e.dataTransfer.files[0]);
            }
        });

        // 画像処理メインロジック
        function handleImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('画像ファイルを選択してください');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    originalFileName = file.name;
                    initializeCanvas();
                    previewSection.classList.add('active');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Canvasの初期化
        function initializeCanvas() {
            const maxWidth = 800;
            const scale = Math.min(1, maxWidth / originalImage.width);
            const displayWidth = originalImage.width * scale;
            const displayHeight = originalImage.height * scale;

            splitCanvas.width = displayWidth;
            splitCanvas.height = displayHeight;

            const ctx = splitCanvas.getContext('2d');
            ctx.drawImage(originalImage, 0, 0, displayWidth, displayHeight);

            // デフォルト4等分
            splitPositions = [];
            for (let i = 1; i < 4; i++) {
                splitPositions.push(displayHeight * (i / 4));
            }

            // 境界線を作成
            createDividers(displayWidth, displayHeight);

            // 最初の分割結果を表示
            updateSplitImages(scale);
        }

        // 境界線を作成
        function createDividers(canvasWidth, canvasHeight) {
            // 既存の境界線を削除
            dividers.forEach(divider => divider.remove());
            dividers = [];

            splitPositions.forEach((pos, index) => {
                const divider = document.createElement('div');
                divider.className = 'divider';
                divider.style.top = (pos - 3) + 'px'; // 境界線の高さ6pxの中央
                divider.dataset.index = index;

                // ドラッグイベント
                divider.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    isDragging = true;
                    currentDividerIndex = index;
                });

                canvasContainer.appendChild(divider);
                dividers.push(divider);
            });
        }

        // マウス移動イベント（ドラッグ）
        document.addEventListener('mousemove', (e) => {
            if (!isDragging || currentDividerIndex < 0) return;

            const rect = splitCanvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;

            // 境界線の位置を更新
            const minHeight = 20; // 最小高さ
            const prevPos = currentDividerIndex > 0 ? splitPositions[currentDividerIndex - 1] : 0;
            const nextPos = currentDividerIndex < splitPositions.length - 1 ? splitPositions[currentDividerIndex + 1] : splitCanvas.height;

            if (mouseY >= prevPos + minHeight && mouseY <= nextPos - minHeight) {
                splitPositions[currentDividerIndex] = mouseY;
                dividers[currentDividerIndex].style.top = (mouseY - 3) + 'px';

                // 画像を再分割
                const scale = splitCanvas.height / originalImage.height;
                updateSplitImages(scale);
            }
        });

        // マウス解放イベント
        document.addEventListener('mouseup', () => {
            isDragging = false;
            currentDividerIndex = -1;
        });

        // 分割画像を更新
        function updateSplitImages(scale) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = originalImage.width;

            imagesGrid.innerHTML = '';

            // 表示上の境界線位置を原寸の位置に変換
            const scaledPositions = splitPositions.map(pos => pos / scale);
            const allPositions = [0, ...scaledPositions, originalImage.height];

            for (let i = 0; i < 4; i++) {
                // 原寸でのマージン（6px）を考慮した分割位置
                const startY = allPositions[i] + 6;
                const endY = allPositions[i + 1] - 6;
                const splitHeight = endY - startY;

                if (splitHeight <= 0) continue;

                canvas.height = splitHeight;
                ctx.drawImage(originalImage, 0, startY, canvas.width, splitHeight, 0, 0, canvas.width, splitHeight);

                // CanvasをデータURLに変換（JPEG形式、品質95%）
                const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

                // 分割した画像の表示とダウンロード機能を作成
                createSplitImageCard(dataUrl, i + 1, canvas.width, splitHeight, originalFileName);
            }
        }

        // 分割画像カードを作成
        function createSplitImageCard(dataUrl, index, width, height, originalName) {
            const card = document.createElement('div');
            card.className = 'split-image-card';

            const img = document.createElement('img');
            img.src = dataUrl;
            img.alt = `分割画像 ${index}`;

            const info = document.createElement('div');
            info.className = 'image-info';
            info.innerHTML = `
                <h3>分割画像 ${index}</h3>
                <p>${Math.round(width)} × ${Math.round(height)} px</p>
            `;

            const downloadBtn = document.createElement('a');
            downloadBtn.className = 'download-btn';
            downloadBtn.href = dataUrl;
            downloadBtn.download = `${getFileNameWithoutExt(originalName)}_${index}.jpg`;
            downloadBtn.textContent = '⬇️ ダウンロード';

            card.appendChild(img);
            card.appendChild(info);
            card.appendChild(downloadBtn);

            imagesGrid.appendChild(card);
        }

        // ファイル名から拡張子を除いた部分を取得
        function getFileNameWithoutExt(filename) {
            const lastDotIndex = filename.lastIndexOf('.');
            return lastDotIndex !== -1 ? filename.substring(0, lastDotIndex) : filename;
        }
    </script>
</body>
</html>
